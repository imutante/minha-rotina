<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Rotina</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--txt:#e8eaf0;--muted:#8a90a0;--acc:#6ee7b7;--warn:#f87171;--blue:#60a5fa;--purple:#a78bfa;--amber:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 12px;z-index:5}
header h1{font-size:20px;margin:0;flex:1}
header .sub{color:var(--muted);font-size:13px}
header .sub::first-letter{text-transform:uppercase}
.back{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;width:42px;height:42px;font-size:24px;cursor:pointer;flex:none}
h4{margin:20px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h4.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--txt);text-align:left;font:inherit;cursor:pointer;min-height:106px}
.tile .ic{font-size:26px;line-height:1.1}
.tile b{font-size:15px}
.tile small{color:var(--muted);font-size:12.5px}
.tile.alert{border-color:var(--amber)}.tile.alert small{color:var(--amber)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,#1b2a25,#181b22)}
.tile.wide>div{display:flex;flex-direction:column;flex:1}
input,select,textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;min-width:0;width:100%;color-scheme:dark}
textarea{resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);cursor:pointer;flex:none;margin:0}
form.add{display:flex;gap:8px;margin:8px 0 12px}
form.add input[name=t]{flex:1}
form.add input[type=date]{flex:0 0 132px;width:auto}
form.add select{flex:1 1 auto;width:auto;max-width:55%}
form.add input.min{flex:0 0 80px}
form.add button{flex:none;width:46px;border:0;border-radius:10px;background:var(--acc);color:#0b0d10;font-weight:700;font-size:22px;cursor:pointer}
form.add.sm{margin:6px 0 4px}form.add.sm input{padding:8px 10px;font-size:14px}form.add.sm button{width:38px;font-size:18px}
form.col{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.btn{border:0;border-radius:10px;background:var(--acc);color:#0b0d10;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wide{width:100%;margin:8px 0}
.prog{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.stat,.hint{color:var(--muted);font-size:13px}
.hint{text-align:center;margin-top:14px}
ul{list-style:none;padding:0;margin:0}
li,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
li{display:flex;align-items:center;gap:10px;padding:10px 12px}
.card{padding:12px}
.row{display:flex;align-items:center;gap:10px}
.t{flex:1;word-break:break-word;cursor:pointer}
.t small{color:var(--muted)}
li.done>.t,li.done>.row>.t{text-decoration:line-through;color:var(--muted)}
.d{font-size:12px;color:var(--muted);white-space:nowrap}
.d.late,.late{color:var(--warn)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;padding:0 4px;flex:none}
li.goal{flex-direction:column;align-items:stretch}
.sub{margin:4px 0 0 32px}
.sub li{background:none;border:0;padding:5px 0;margin:0;border-radius:0}
.empty{color:var(--muted);text-align:center;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kpi b{font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi small{color:var(--muted);font-size:11.5px}
.chev{color:var(--muted)}
.revs i{font-style:normal;font-size:10px;padding:2px 4px;border-radius:4px;background:var(--line);color:var(--muted);margin-left:3px}
.revs i.ok{background:var(--acc);color:#0b0d10}
.pill{border:0;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;color:#0b0d10;cursor:pointer;white-space:nowrap;flex:none}
.st-ideia{background:#6b7280}.st-roteiro{background:var(--blue)}.st-gravado{background:var(--purple)}.st-editado{background:var(--amber)}.st-postado{background:var(--acc)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.calhead button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;width:42px;height:38px;font-size:20px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;color:var(--muted);font-size:11px}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:50px;padding:4px;cursor:pointer}
.day b{font-size:12px;font-weight:600}
.day.today b{color:var(--acc)}.day.sel{border-color:var(--acc);background:var(--card2)}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.chips i,.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{margin-right:4px}
.hab.ok{border-color:#2f5f4d}
.fire{font-size:13px;color:var(--amber);white-space:nowrap}
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:20px;cursor:pointer}
.cnt b{min-width:36px;text-align:center}
.dots{display:flex;gap:4px;margin-top:10px}
.dot{flex:1;text-align:center;font-size:10px;color:var(--muted);cursor:pointer}
.dot i{display:block;height:16px;border-radius:5px;margin-bottom:2px;background:var(--line)}
.dot.ok i{background:var(--acc)}.dot.miss i{background:#3b2326;border:1px solid #7f3a3a}.dot.off i{background:none;border:1px dashed var(--line)}
.search{margin:4px 0 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.tag.on{background:var(--acc);color:#0b0d10;border-color:var(--acc)}
.note{cursor:pointer;white-space:normal}
.note .tg{color:var(--acc)}
.memo{color:var(--muted);font-size:13px;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.tools button,.tools label{padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;border:1px solid var(--line)}
.sheet h3{margin:0 0 12px}
.fl{margin-bottom:10px}.fl>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.days{display:flex;gap:5px}.days label{flex:1}.days input{display:none}
.days span{display:block;text-align:center;padding:9px 0;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.days input:checked+span{background:var(--acc);color:#0b0d10;font-weight:700}
/* estudos / painéis */
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.stab.on{background:var(--acc);color:#0b0d10;border-color:var(--acc);font-weight:700}
.badge{font-style:normal;background:var(--warn);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;font-weight:700}
.gl{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:8px}.gl span{color:var(--muted)}
.bars{display:flex;gap:3px;align-items:stretch;height:130px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bc small{font-size:9px;color:var(--muted);height:12px;white-space:nowrap}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bw i{display:block;width:100%;max-width:22px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bc span{font-size:10px;color:var(--muted);margin-top:3px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{border-radius:3px;background:var(--line)}
.heat i.l1{background:#1f4d3d}.heat i.l2{background:#2f7a5f}.heat i.l3{background:#4fb38a}.heat i.l4{background:var(--acc)}.heat i.fut{background:none}
.tr{display:grid;grid-template-columns:2.2fr 1fr 1.1fr 1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.tr:last-child{border:0}.tr.th{color:var(--muted);font-size:11px;padding-top:0}
.tr span:not(:first-child){text-align:right}
.good,.ok{color:var(--acc)}.mid{color:var(--amber)}.bad{color:var(--warn)}
.exam{display:flex;align-items:center;justify-content:space-between;border-color:var(--purple)}
.exam small{display:block;color:var(--muted)}.exam b{font-size:20px}
.timer{text-align:center}
.clock{font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0;letter-spacing:1px}
.clock.run{color:var(--acc)}
.alertc{border-color:var(--amber);cursor:pointer;font-size:14px}
.big{font-size:44px;font-weight:800;line-height:1}
.prow{cursor:pointer;padding:2px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- utilidades ----------
const KEY='minha-rotina-v1';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const T=()=>ds(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const wd=s=>new Date(s+'T12:00').getDay();
const fmt=s=>s?s.slice(8)+'/'+s.slice(5,7):'';
const fmtLong=s=>new Date(s+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find=(a,id)=>a.find(x=>x.id===id);
const del=(a,x)=>{const i=a.indexOf(x);if(i>=0)a.splice(i,1)};
const sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
const hm=m=>{m=Math.round(m||0);return m<60?`${m}min`:`${Math.floor(m/60)}h${m%60?pad(m%60):''}`};
const pct=f=>Math.round((f||0)*100)+'%';
const cls=f=>f>=.8?'good':f>=.6?'mid':'bad';
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>Math.round(Number(v)||0).toLocaleString('pt-BR');
const num1=(v,d=1)=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pnum=x=>{let s=String(x??'').trim();if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)||0};
const bar=f=>`<div class="prog"><i style="width:${Math.round(Math.min(1,Math.max(0,f||0))*100)}%"></i></div>`;
const kpi=(v,l)=>`<div class="kpi"><b>${v}</b><small>${l}</small></div>`;
const empty=(t='Nada aqui ainda.')=>`<div class="empty">${t}</div>`;
const due=(d,done)=>{if(!d)return '';const l=!done&&d<T();return `<span class="d ${l?'late':''}">${l?'atrasada · ':''}${fmt(d)}</span>`};
const DN=['D','S','T','Q','Q','S','S'],DN3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const ALL=[0,1,2,3,4,5,6];
const ST=[['ideia','Ideia'],['roteiro','Roteiro'],['gravado','Gravado'],['editado','Editado'],['postado','Postado']];
const FREQ=[[1,'Todo dia'],[2,'A cada 2 dias'],[3,'A cada 3 dias'],[7,'Semanal'],[15,'Quinzenal'],[30,'Mensal']];
const TYPES=[['teoria','Teoria'],['questoes','Questões'],['revisao','Revisão'],['leitura','Lei seca'],['video','Videoaula']];
const freqName=f=>(FREQ.find(x=>x[0]==f)||[0,`A cada ${f} dias`])[1];
const TAGRE=/#[\p{L}\p{N}_]+/gu;
const tagsOf=t=>(t.match(TAGRE)||[]).map(x=>x.toLowerCase());

// ---------- gráficos ----------
function barChart(vals,labels,lab){const mx=Math.max(...vals,1e-9);return `<div class="bars">${vals.map((v,i)=>`<div class="bc"><small>${lab(v)}</small><div class="bw"><i style="height:${v/mx*100}%"></i></div><span>${labels[i]}</span></div>`).join('')}</div>`}
function lineChart(vals,lab,ref){const n=vals.length,mn=Math.min(...vals,ref??Infinity),mx=Math.max(...vals,ref??-Infinity),X=i=>n<2?150:14+i*(272/(n-1)),Y=v=>108-((v-mn)/((mx-mn)||1))*88;
  return `<div class="card"><svg viewBox="0 0 300 120" width="100%">${ref!=null?`<line x1="8" x2="292" y1="${Y(ref)}" y2="${Y(ref)}" stroke="#3a4050" stroke-dasharray="4"/>`:''}<polyline fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linejoin="round" points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#6ee7b7"/><text x="${X(i)}" y="${Y(v)-8}" fill="#e8eaf0" font-size="10" text-anchor="middle">${lab(v)}</text>`).join('')}</svg></div>`}
function heatmap(minByDay){const t=T(),s0=addD(t,-wd(t)-77);let h='';for(let i=0;i<84;i++){const d=addD(s0,i),m=minByDay[d]||0;h+=`<i class="${d>t?'fut':m>=240?'l4':m>=120?'l3':m>=60?'l2':m>0?'l1':''}" title="${fmt(d)} · ${hm(m)}"></i>`}
  return `<div class="card"><div class="heat">${h}</div><div class="legend" style="margin:8px 0 0">menos <i style="border-radius:2px;background:var(--line)"></i><i style="border-radius:2px;background:#1f4d3d"></i><i style="border-radius:2px;background:#2f7a5f"></i><i style="border-radius:2px;background:#4fb38a"></i><i style="border-radius:2px;background:var(--acc)"></i> mais</div></div>`}

// ---------- dados ----------
function defaults(){return{
  start:T(),tasks:[],goals:[],
  habits:{list:[
    {id:'agua',name:'Beber água',group:'Saúde',type:'count',target:8,days:ALL},
    {id:'creatina',name:'Tomar creatina',group:'Saúde',type:'check',target:1,days:ALL},
    {id:'corrida',name:'Corrida',group:'Corrida',type:'check',target:1,days:[1,3,5]},
    {id:'forca',name:'Fortalecimento',group:'Fortalecimento',type:'check',target:1,days:[2,4,6]}],log:{}},
  study:{concurso:{subjects:[],sessions:[]},ia:{subjects:[],sessions:[]}},
  posts:{insta:[],dark:[]},
  notes:[],
  clean:[['Lavar a louça',1],['Tirar o lixo',2],['Varrer e passar pano',7],['Limpar o banheiro',7],['Trocar roupa de cama',15],['Limpar a geladeira',30]].map(([text,freq])=>({id:uid(),text,freq,last:''})),
  trips:[],
  car:{fuel:[],maint:[]}
}}
function normalize(){
  for(const k of ['concurso','ia']){const st=S.study[k]=S.study[k]||{subjects:[],sessions:[]};
    st.cycle=st.cycle||[];st.cycleDone=st.cycleDone||{};st.cycles=st.cycles||0;st.sims=st.sims||[];
    st.goals=st.goals||{hours:k==='ia'?7:20,questions:k==='ia'?0:200};st.exam=st.exam||{name:'',date:''};st.timer=st.timer||null}
  S.car=S.car||{fuel:[],maint:[]};S.start=S.start||T()}
let S=defaults();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(defaults(),s);
  else{const old=JSON.parse(localStorage.getItem('minhas-listas-v1'));if(old){S.tasks=old.tasks||[];S.goals=old.goals||[]}}}catch(e){}
normalize();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não consegui salvar. Exporte um backup.')}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// estado da tela (não salvo)
let navd=false,refocus=-1,NQ='',NTAG='';const OPEN=new Set(),CAL={},SEL={},STAB={};

// ---------- cálculos ----------
const gp=g=>g.steps.length?Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100):(g.done?100:0);
const hVal=(h,d)=>(S.habits.log[d]||{})[h.id];
const hDone=(h,d)=>h.type==='count'?(hVal(h,d)||0)>=h.target:!!hVal(h,d);
const hSched=(h,d)=>d>=S.start&&h.days.includes(wd(d));
function streak(h){let n=0,d=T();for(let i=0;i<500&&d>=S.start;i++){if(hSched(h,d)){if(hDone(h,d))n++;else if(d!==T())break}d=addD(d,-1)}return n}
function habRate(n,end=T()){let s=0,d=0;for(let i=0;i<n;i++){const day=addD(end,-i);for(const h of S.habits.list)if(hSched(h,day)){s++;if(hDone(h,day))d++}}return s?d/s:null}
function dueReviews(st){const t=T(),r=[];for(const s of st.subjects)for(const tp of s.topics){if(!tp.done||!tp.doneDate)continue;const n=[1,7,30].find(n=>!(tp.rev||{})[n]);if(n&&addD(tp.doneDate,n)<=t)r.push({s,tp,n,when:addD(tp.doneDate,n)})}return r}
function nextReviews(st,days){const t=T(),lim=addD(t,days),r=[];for(const s of st.subjects)for(const tp of s.topics){if(!tp.done||!tp.doneDate)continue;const n=[1,7,30].find(n=>!(tp.rev||{})[n]);if(!n)continue;const w=addD(tp.doneDate,n);if(w>t&&w<=lim)r.push({s,tp,n,when:w})}return r.sort((a,b)=>a.when.localeCompare(b.when))}
function topicOf(st,id){for(const s of st.subjects){const tp=find(s.topics,id);if(tp)return[s,tp]}return[]}
const tmElapsed=tm=>tm?(tm.acc||0)+(tm.start?Date.now()-tm.start:0):0;
const clock=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
const nextClean=c=>c.last?addD(c.last,c.freq):T();
const postsLate=L=>L.filter(p=>p.date&&p.date<T()&&p.status!=='postado');
const carOdo=()=>Math.max(0,...S.car.fuel.map(f=>+f.odo||0),...S.car.maint.map(m=>+m.odo||0));
function fuelStats(){const F=[...S.car.fuel].sort((a,b)=>(a.odo-b.odo)||a.date.localeCompare(b.date)),per={};let km=0,lit=0,cost=0,lf=-1;
  F.forEach((f,i)=>{if(lf<0){if(f.full)lf=i;return}if(!f.full)return;const k=f.odo-F[lf].odo,seg=F.slice(lf+1,i+1),l=sum(seg,'liters');if(k>0&&l>0){per[f.id]=k/l;km+=k;lit+=l;cost+=sum(seg,'total')}lf=i});
  return{F,per,avg:lit?km/lit:0,cpk:km?cost/km:0}}
function maintDue(){const odo=carOdo(),lim=addD(T(),15),latest={};

return`<li class="${x.done?'done':''}"><input type="checkbox" data-a="topTog" data-k="${k}" data-id="${x.id}" ${x.done?'checked':''}><span class="t">${esc(x.text)}${tq?` <small class="${cls(tc/tq)}">· ${tc}/${tq}</small>`:''}</span>${x.done?`<span class="revs">${[1,7,30].map(n=>`<i class="${(x.rev||{})[n]?'ok':''}">R${n}</i>`).join('')}</span>`:''}<button class="x" data-a="topDel" data-k="${k}" data-id="${x.id}">×</button></li>`}).join('')}</ul>

SV.ciclo=(k,st)=>{const tot=sum(st.cycle,'min'),done=st.cycle.reduce((a,i)=>a+Math.min(i.min,st.cycleDone[i.sub]||0),0),nx=nextCycleItem(st),fora=st.subjects.filter(s=>!st.cycle.some(i=>i.sub===s.id));

V.car=()=>{const{F,per,avg,cpk}=fuelStats(),t=T(),M=S.car.maint,odo=carOdo(),dueM=maintDue(),last=F[F.length-1];
  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`});

<h4>Gasto por mês (combustível + manutenção)</h4>${barChart(months.map(carMonth),months.map(x=>MESES[+x.slice(5)-1].slice(0,3)),v=>v?'R$'+num(v):'')}

// ---------- modal ----------
function field(f){const v=f.v??'';let inp;
  if(f.type==='raw')inp=f.html;
  else if(f.type==='select')inp=`<select name="${f.k}">${f.opts.map(([val,l])=>`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea name="${f.k}" rows="${f.rows||5}" ${f.req?'required':''}>${esc(v)}</textarea>`;
  else if(f.type==='days')inp=`<div class="days">${DN3.map((d,i)=>`<label><input type="checkbox" name="${f.k}" value="${i}" ${v.includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div>`;
  else if(f.type==='number')inp=`<input type="text" inputmode="decimal" name="${f.k}" value="${v===''||v==null?'':esc(String(v).replace('.',','))}" ${f.req?'required':''} autocomplete="off" placeholder="${f.ph||''}">`;
  else inp=`<input type="${f.type||'text'}" name="${f.k}" value="${esc(v)}" ${f.req?'required':''} autocomplete="off" placeholder="${f.ph||''}">`;
  return`<div class="fl"><span>${f.label}</span>${inp}</div>`}
function modal(title,fields,onSave,onDel){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<form class="sheet"><h3>${esc(title)}</h3>${fields.map(field).join('')}<div class="row" style="margin-top:14px">${onDel?'<button type="button" class="btn danger" data-m="del">Excluir</button>':''}<span style="flex:1"></span><button type="button" class="btn ghost" data-m="x">Cancelar</button><button class="btn">Salvar</button></div></form>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{const b=e.target.dataset.m;if(e.target===m||b==='x')m.remove();if(b==='del'&&confirm('Excluir mesmo?')){onDel();m.remove();commit()}});
  m.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),o={};
    for(const f of fields)o[f.k]=f.type==='days'?fd.getAll(f.k).map(Number):f.type==='number'?pnum(fd.get(f.k)):String(fd.get(f.k)||'').trim();
    if(onSave(o)===false)return;m.remove();commit()});
  setTimeout(()=>{const i=m.querySelector('input:not([type=checkbox]),textarea');i&&i.focus()},50)}

    if(o.topic&&o.type==='teoria')markTopicStudied(st,o.topic,o.date);after&&after()},novo?null:()=>del(st.sessions,x))}
function simModal(k,x){const st=S.study[k],novo=!x;x=x||{name:'',date:T(),total:'',correct:'',score:'',notes:''};
  modal(novo?'Novo simulado':'Simulado',[{k:'name',label:'Nome / banca',v:x.name,ph:'Ex: Simulado Seven 03'},{k:'date',label:'Data',type:'date',v:x.date},{k:'total',label:'Total de questões',type:'number',v:x.total,req:1},{k:'correct',label:'Acertos',type:'number',v:x.correct,req:1},{k:'score',label:'Nota (opcional)',type:'number',v:x.score},{k:'notes',label:'O que errei / observações',type:'textarea',rows:3,v:x.notes}],
  o=>{if(!o.total){alert('Informe o total de questões.');return false}o.correct=Math.min(o.correct,o.total);o.date=o.date||T();if(novo)st.sims.push({id:uid(),...o});else Object.assign(x,o)},novo?null:()=>del(st.sims,x))}
function fuelModal(f){const novo=!f,last=[...S.car.fuel].sort((a,b)=>b.odo-a.odo)[0];f=f||{date:T(),odo:'',total:'',price:last?last.price:'',fuel:last?last.fuel:'Gasolina',full:true,station:''};
  modal(novo?'⛽ Abastecimento':'Editar abastecimento',[{k:'date',label:'Data',type:'date',v:f.date},{k:'odo',label:`Odômetro (km)${carOdo()?` · último: ${num(carOdo())}`:''}`,type:'number',v:f.odo,req:1},{k:'total',label:'Valor pago (R$)',type:'number',v:f.total,req:1},{k:'price',label:'Preço do litro (R$)',type:'number',v:f.price,req:1},
    {k:'fuel',label:'Combustível',type:'select',v:f.fuel,opts:[['Gasolina','Gasolina'],['Etanol','Etanol'],['Diesel','Diesel'],['GNV','GNV']]},{k:'full',label:'Encheu o tanque?',type:'select',v:f.full?'sim':'nao',opts:[['sim','Sim, completei'],['nao','Não, foi parcial']]},{k:'station',label:'Posto (opcional)',v:f.station}],
  o=>{if(!o.total||!o.price||!o.odo){alert('Preencha odômetro, valor pago e preço do litro.');return false}o.full=o.full==='sim';o.liters=o.total/o.price;o.date=o.date||T();if(novo)S.car.fuel.push({id:uid(),...o});else Object.assign(f,o)},novo?null:()=>del(S.car.fuel,f))}
function maintModal(x){const novo=!x;x=x||{date:T(),item:'',type:'Manutenção',cost:'',odo:carOdo()||'',nextOdo:'',nextDate:'',notes:''};
  modal(novo?'🔧 Manutenção / peça':'Editar manutenção',[{k:'date',label:'Data',type:'date',v:x.date},{k:'item',label:'O que foi feito / comprado',v:x.item,req:1,ph:'Ex: Troca de óleo, pneu, pastilha de freio'},{k:'type',label:'Tipo',type:'select',v:x.type,opts:[['Manutenção','Manutenção'],['Peça','Peça'],['Revisão','Revisão'],['Documentação','Documentação / IPVA'],['Outro','Outro']]},
    {k:'cost',label:'Valor (R$)',type:'number',v:x.cost},{k:'odo',label:'Odômetro (km)',type:'number',v:x.odo},{k:'nextOdo',label:'Próxima troca aos (km) — opcional',type:'number',v:x.nextOdo,ph:'Ex: odômetro atual + 5000'},{k:'nextDate',label:'Ou próxima data — opcional',type:'date',v:x.nextDate},{k:'notes',label:'Observações (marca, oficina...)',type:'textarea',rows:2,v:x.notes}],
  o=>{o.date=o.date||T();if(novo)S.car.maint.push({id:uid(),...o});else Object.assign(x,o)},novo?null:()=>del(S.car.maint,x))}

const A={
  go:e=>{navd=true;location.hash=e.dataset.k},
  home:()=>{if(navd){navd=false;history.back()}else location.hash=''},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`backup-minha-rotina-${T()}.json`;document.body.appendChild(a);a.click();a.remove()},
  // tarefas
  tTog:e=>{const x=find(S.tasks,e.dataset.id);x.done=!x.done;commit()},
  tDel:e=>{const x=find(S.tasks,e.dataset.id);if(confirm(`Excluir "${x.text}"?`)){del(S.tasks,x);commit()}},
  tEdit:e=>{const x=find(S.tasks,e.dataset.id);modal('Editar tarefa',[{k:'text',label:'Tarefa',v:x.text,req:1},{k:'due',label:'Prazo',type:'date',v:x.due}],o=>{Object.assign(x,o)},()=>del(S.tasks,x))},
  tClr:()=>{const n=S.tasks.filter(x=>x.done).length;if(confirm(`Remover ${n} concluída(s)?`)){S.tasks=S.tasks.filter(x=>!x.done);commit()}},
  // metas
  gTog:e=>{const g=find(S.goals,e.dataset.id);if(g.steps.length){const v=gp(g)<100;g.steps.forEach(s=>s.done=v)}else g.done=!g.done;commit()},
  gDel:e=>{const g=find(S.goals,e.dataset.id);if(confirm(`Excluir a meta "${g.text}"?`)){del(S.goals,g);commit()}},
  gEdit:e=>{const g=find(S.goals,e.dataset.id);modal('Editar meta',[{k:'text',label:'Meta',v:g.text,req:1},{k:'due',label:'Prazo',type:'date',v:g.due}],o=>{Object.assign(g,o)},()=>del(S.goals,g))},
  sTog:e=>{const s=find(find(S.goals,e.dataset.id).steps,e.dataset.s);s.done=!s.done;commit()},
  sDel:e=>{const g=find(S.goals,e.dataset.id);del(g.steps,find(g.steps,e.dataset.s));commit()},
  // hábitos
  hPlus:e=>{const h=find(S.habits.list,e.dataset.id);logSet(h.id,T(),(hVal(h,T())||0)+1);commit()},
  hMinus:e=>{const h=find(S.habits.list,e.dataset.id);logSet(h.id,T(),Math.max(0,(hVal(h,T())||0)-1));commit()},
  hTog:e=>{const h=find(S.habits.list,e.dataset.id);logSet(h.id,T(),!hVal(h,T()));commit()},
  hDot:e=>{const h=find(S.habits.list,e.dataset.id),d=e.dataset.d;logSet(h.id,d,h.type==='count'?(hDone(h,d)?0:h.target):!hVal(h,d));commit()},
  hEdit:e=>habModal(find(S.habits.list,e.dataset.id)),
  hNew:()=>habModal(),
  // estudos
  stab:e=>{STAB[e.dataset.k]=e.dataset.t;render();window.scrollTo(0,0)},
  stGoals:e=>{const st=st_(e);modal('Metas e prova',[{k:'name',label:'Concurso / prova',v:st.exam.name,ph:'Ex: Prefeitura de Imperatriz'},{k:'date',label:'Data da prova',type:'date',v:st.exam.date},{k:'hours',label:'Meta de horas por semana',type:'number',v:st.goals.hours},{k:'questions',label:'Meta de questões por semana (0 = sem meta)',type:'number',v:st.goals.questions}],
    o=>{st.exam={name:o.name,date:o.date};st.goals={hours:o.hours||1,questions:Math.round(o.questions)}})},
  subjOpen:e=>{const id=e.dataset.id;OPEN.has(id)?OPEN.delete(id):OPEN.add(id);render()},
  subjEdit:e=>{const st=st_(e),s=find(st.subjects,e.dataset.id);modal('Matéria',[{k:'name',label:'Nome',v:s.name,req:1}],o=>{s.name=o.name},()=>{del(st.subjects,s);st.sessions=st.sessions.filter(x=>x.sub!==s.id);st.cycle=st.cycle.filter(i=>i.sub!==s.id)})},
  topTog:e=>{const[,tp]=topicOf(st_(e),e.dataset.id);tp.done=!tp.done;tp.doneDate=tp.done?T():'';tp.rev={};commit()},
  topDel:e=>{const[s,tp]=topicOf(st_(e),e.dataset.id);del(s.topics,tp);commit()},
  topBulk:e=>{const s=find(st_(e).subjects,e.dataset.id);modal(`Tópicos de ${s.name}`,[{k:'list',label:'Cole os tópicos, um por linha',type:'textarea',rows:10,req:1}],
    o=>{o.list.split(/\r?\n/).map(l=>l.replace(/^\s*[\d.\-–•)]+\s*/,'').trim()).filter(Boolean).forEach(text=>s.topics.push({id:uid(),text,done:false,doneDate:'',rev:{}}))})},
  revDo:e=>{const[,tp]=topicOf(st_(e),e.dataset.id);(tp.rev=tp.rev||{})[e.dataset.n]=true;commit()},
  sesNew:e=>sesModal(e.dataset.k,{}),
  sesEdit:e=>{const st=st_(e);sesModal(e.dataset.k,find(st.sessions,e.dataset.id))},
  sesDel:e=>{const st=st_(e);if(confirm('Apagar este registro?')){del(st.sessions,find(st.sessions,e.dataset.id));commit()}},
  tmStart:e=>{const st=st_(e),tm=st.timer||{sub:'',start:null,acc:0};tm.sub=document.getElementById('tsub').value;tm.start=Date.now();st.timer=tm;commit()},
  tmPause:e=>{const tm=st_(e).timer;tm.acc=tmElapsed(tm);tm.start=null;commit()},
  tmReset:e=>{if(confirm('Zerar o cronômetro sem registrar?')){st_(e).timer=null;commit()}},
  tmDone:e=>{const k=e.dataset.k,st=S.study[k],tm=st.timer;tm.acc=tmElapsed(tm);tm.start=null;save();const[sub,topic]=(tm.sub||document.getElementById('tsub').value).split('|');
    sesModal(k,{sub,topic,min:Math.max(1,Math.round(tm.acc/60000)),type:'teoria'},()=>{st.timer=null});render()},
  cycEdit:e=>{const st=st_(e),i=st.cycle.find(x=>x.sub===e.dataset.id);modal(subName(st,i.sub),[{k:'min',label:'Minutos por volta do ciclo',type:'number',v:i.min,req:1},{k:'done',label:'Já feito nesta volta (min)',type:'number',v:st.cycleDone[i.sub]||0}],o=>{i.min=Math.max(1,Math.round(o.min));st.cycleDone[i.sub]=Math.round(o.done)})},
  cycDel:e=>{const st=st_(e);st.cycle=st.cycle.filter(i=>i.sub!==e.dataset.id);commit()},
  cycReset:e=>{const st=st_(e),done=!nextCycleItem(st);if(done||confirm('Reiniciar o ciclo do zero?')){if(done)st.cycles++;st.cycleDone={};commit()}},
  simNew:e=>simModal(e.dataset.k),
  simEdit:e=>simModal(e.dataset.k,find(st_(e).sims,e.dataset.id)),
  // postagens
  pDay:e=>{SEL[e.dataset.k]=e.dataset.d;render()},
  pMon:e=>{const k=e.dataset.k,[y,m]=(CAL[k]||T().slice(0,7)).split('-').map(Number),d=new Date(y,m-1+Number(e.dataset.n),1);CAL[k]=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()},
  pNext:e=>{const p=find(S.posts[e.dataset.k],e.dataset.id),i=ST.findIndex(s=>s[0]===p.status);p.status=ST[(i+1)%ST.length][0];commit()},
  pEdit:e=>{const L=S.posts[e.dataset.k],p=find(L,e.dataset.id);modal('Post',[{k:'title',label:'Título / tema',v:p.title,req:1},{k:'date',label:'Data (vazio = banco de ideias)',type:'date',v:p.date},{k:'status',label:'Etapa',type:'select',opts:ST,v:p.status},{k:'notes',label:'Roteiro, legenda, hashtags...',type:'textarea',v:p.notes}],o=>{Object.assign(p,o)},()=>del(L,p))},
  // insights
  nTag:e=>{NTAG=NTAG===e.dataset.t?'':e.dataset.t;render()},
  nEdit:e=>{const n=find(S.notes,e.dataset.id);modal('Insight',[{k:'text',label:'Texto (use #etiquetas)',type:'textarea',v:n.text,req:1}],o=>{n.text=o.text},()=>del(S.notes,n))},
  // limpeza
  cDo:e=>{const c=find(S.clean,e.dataset.id);c.prev=c.last;c.last=T();commit()},
  cUndo:e=>{const c=find(S.clean,e.dataset.id);c.last=c.prev||'';c.prev='';commit()},
  cEdit:e=>{const c=find(S.clean,e.dataset.id);modal('Tarefa de limpeza',[{k:'text',label:'Tarefa',v:c.text,req:1},{k:'freq',label:'Frequência',type:'select',opts:FREQ,v:c.freq},{k:'last',label:'Última vez que foi feita',type:'date',v:c.last}],o=>{o.freq=Number(o.freq);Object.assign(c,o)},()=>del(S.clean,c))},
  // passeios
  trSched:e=>{const x=find(S.trips,e.dataset.id);modal(`Agendar: ${x.place}`,[{k:'date',label:'Data',type:'date',v:x.date||T(),req:1}],o=>{x.date=o.date;x.status='agendado'})},
  trDone:e=>{const x=find(S.trips,e.dataset.id);modal(`Como foi? ${x.place}`,[{k:'date',label:'Data',type:'date',v:x.date||T()},{k:'note',label:'Lembrança do passeio',type:'textarea',v:x.note}],o=>{Object.assign(x,o);x.status='feito'})},
  trEdit:e=>{const x=find(S.trips,e.dataset.id);modal('Passeio',[{k:'place',label:'Lugar',v:x.place,req:1},{k:'status',label:'Situação',type:'select',v:x.status,opts:[['quero','Queremos ir'],['agendado','Agendado'],['feito','Já fomos']]},{k:'date',label:'Data',type:'date',v:x.date},{k:'note',label:'Anotações / lembrança',type:'textarea',v:x.note}],o=>{Object.assign(x,o)},()=>del(S.trips,x))},
  // carro
  fuelNew:()=>fuelModal(),
  fuelEdit:e=>fuelModal(find(S.car.fuel,e.dataset.id)),
  maintNew:()=>maintModal(),
  maintEdit:e=>maintModal(find(S.car.maint,e.dataset.id)),
};

const F={
  task:(f,d)=>S.tasks.push({id:uid(),text:d.t,done:false,due:d.d||''}),
  goal:(f,d)=>S.goals.push({id:uid(),text:d.t,done:false,due:d.d||'',steps:[]}),
  step:(f,d)=>find(S.goals,f.dataset.id).steps.push({id:uid(),text:d.t,done:false}),
  subj:(f,d)=>{const s={id:uid(),name:d.t,topics:[]};S.study[f.dataset.k].subjects.push(s);OPEN.add(s.id)},
  topic:(f,d)=>find(S.study[f.dataset.k].subjects,f.dataset.id).topics.push({id:uid(),text:d.t,done:false,doneDate:'',rev:{}}),
  cyc:(f,d)=>{const m=Math.round(pnum(d.t));if(m>0&&d.s)S.study[f.dataset.k].cycle.push({sub:d.s,min:m})},
  post:(f,d)=>S.posts[f.dataset.k].push({id:uid(),title:d.t,date:f.dataset.d,status:'ideia',notes:''}),
  note:(f,d)=>S.notes.push({id:uid(),ts:Date.now(),date:T(),text:d.t}),
  clean:(f,d)=>S.clean.push({id:uid(),text:d.t,freq:Number(d.f)||7,last:''}),
  trip:(f,d)=>S.trips.push({id:uid(),place:d.t,status:'quero',date:'',note:''}),
};

// ---------- render ----------
const app=document.getElementById('app');
function render(){
  const v=location.hash.slice(1),s=SECS.find(x=>x.k===v);
  const body=!s?V.home():(v==='concurso'||v==='ia')?V.study(v):(v==='insta'||v==='dark')?V.posts(v):V[v]();
  app.innerHTML=(s?`<header><button class="back" data-a="home" aria-label="Voltar">‹</button><h1>${s.ic} ${s.name}</h1></header>`
    :`<header><div style="flex:1"><h1>Minha Rotina</h1><div class="sub">${fmtLong(T())}</div></div></header>`)+body;
  if(refocus>=0){const f=app.querySelectorAll('form[data-f]')[refocus];const i=f&&f.querySelector('input[name=t],textarea');i&&i.focus();refocus=-1}
}
function commit(){save();render()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.closest('.modal'))return;const fn=A[el.dataset.a];if(fn)fn(el)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f));d.t=String(d.t||'').trim();if(!d.t)return;
  refocus=[...app.querySelectorAll('form[data-f]')].indexOf(f);F[f.dataset.f](f,d);commit()});
document.addEventListener('input',e=>{if(e.target.id==='nq'){NQ=e.target.value;document.getElementById('nlist').innerHTML=noteList()}});
document.addEventListener('change',e=>{
  if(e.target.id==='tsub'){const st=S.study[e.target.dataset.k];if(st.timer){st.timer.sub=e.target.value;save()}return}
  if(e.target.id!=='imp')return;const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.habits||!d.tasks)throw 0;if(confirm('Substituir TODOS os dados deste aparelho pelo backup?')){S=Object.assign(defaults(),d);normalize();commit()}}catch(err){alert('Arquivo de backup inválido.')}};
  r.readAsText(file);e.target.value=''});
window.addEventListener('hashchange',()=>{if(!location.hash)navd=false;window.scrollTo(0,0);render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.querySelector('.modal'))render()});
setInterval(()=>{const c=document.getElementById('tclock');if(!c)return;const st=S.study[location.hash.slice(1)];if(st&&st.timer)c.textContent=clock(tmElapsed(st.timer))},1000);
render();

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
